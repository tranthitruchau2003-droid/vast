<!-- ================= VIEW: CÀI ĐẶT ================= -->
<div x-show="currentView === 'settings' && !selectedPondId" x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
    style="display: none;" class="pb-24 md:pb-8">
    <div class="w-full">
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 w-full">
            <div class="space-y-4">
                <button @click="openProfileModal()"
                    class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 rounded-2xl transition-all active:scale-95 text-slate-700 font-bold text-left">
                    <div class="flex items-center gap-3">
                        <i data-lucide="user-pen" class="w-5 h-5 text-blue-500"></i>
                        <span>Chỉnh sửa hồ sơ</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
                </button>

                <button @click="showLogoutConfirmModal = true"
                    class="w-full flex items-center justify-between p-4 bg-red-50 hover:bg-red-100 rounded-2xl transition-all active:scale-95 text-red-600 font-bold text-left border border-red-100">
                    <div class="flex items-center gap-3">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                        <span>Đăng xuất tài khoản</span>
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>
