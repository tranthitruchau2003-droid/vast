<!-- SIDEBAR (DESKTOP) -->
<aside
    class="hidden md:flex flex-col w-[280px] bg-white border-r border-slate-200 z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
    <div class="h-20 flex items-center px-6 border-b border-slate-100">
        <img src="logo.png" alt="VAST Logo" class="w-10 h-10 object-contain mr-1">
        <div>
            <h1 class="font-bold text-2xl text-green-600 leading-tight uppercase tracking-wider">VAST</h1>
        </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2 font-medium">
        <template x-for="item in navItems" :key="item.id">
            <a href="#" @click.prevent="currentView = item.id; if(item.id === 'dashboard') selectedPondId = null;"
                :class="currentView === item.id && !selectedPondId ? 'bg-green-50 text-green-700 font-bold' : 'text-slate-600 hover:bg-slate-50'"
                class="flex items-center px-4 py-3.5 rounded-2xl transition-colors">
                <i :data-lucide="item.icon" class="w-6 h-6 mr-4"
                    :class="currentView === item.id ? 'text-green-600' : 'text-slate-400'"></i>
                <span x-text="item.label" class="text-[1.1rem]"></span>
            </a>
        </template>
    </nav>

    <div class="p-4 border-t border-slate-100">
        <div class="bg-slate-50 rounded-xl p-4 flex items-center justify-between">
            <div class="flex items-center">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse mr-2"></div>
                <span class="text-sm font-semibold text-slate-600">IoT Connected</span>
            </div>
            <i data-lucide="wifi" class="w-4 h-4 text-green-500"></i>
        </div>
    </div>
</aside>
