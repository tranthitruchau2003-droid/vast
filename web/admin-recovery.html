<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin hỗ trợ khôi phục - VAST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/vast-config.js?v=5"></script>
    <script src="js/device-auth.js?v=1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        html, body { min-height: 100%; overflow-y: auto; }
        body { font-family: Inter, Arial, sans-serif; font-size: 17px; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800" x-data="adminPage()" x-init="init()">
<main class="w-full max-w-[1500px] mx-auto p-4 sm:p-8 lg:p-10">
    <header class="flex flex-wrap justify-between items-center gap-5 mb-7">
        <div>
            <a href="dashboard.html" class="text-lg font-black text-green-700">← Quay lại Dashboard</a>
            <h1 class="text-3xl sm:text-4xl font-black mt-3">Hỗ trợ khôi phục tài khoản</h1>
            <p class="text-lg text-slate-500 mt-2">Hệ thống tự đối chiếu dữ liệu. Admin không đặt mật khẩu hộ khách.</p>
        </div>
        <button @click="load()" class="px-7 py-4 rounded-2xl bg-slate-900 text-white text-lg font-black shadow-lg">
            Làm mới danh sách
        </button>
    </header>

    <div x-show="message" x-cloak role="alert"
        class="fixed top-5 right-5 z-[100] w-[calc(100%-2.5rem)] max-w-xl p-5 rounded-2xl
            text-lg font-bold border shadow-2xl"
        :class="error ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-800 border-green-200'"
        x-text="message"></div>

    <section x-show="!authorized && !loading" x-cloak class="bg-white p-10 rounded-3xl border text-center">
        <h2 class="font-black text-2xl">Không có quyền truy cập</h2>
        <p class="text-lg text-slate-500 mt-3">Số điện thoại này chưa được cấp quyền Admin trên máy chủ.</p>
    </section>

    <section x-show="authorized" x-cloak class="space-y-6">
        <nav class="flex gap-3 overflow-auto pb-1">
            <template x-for="s in ['pending','approved','completed','rejected','all']" :key="s">
                <button @click="filter=s"
                    class="px-5 py-3 rounded-2xl text-base font-black whitespace-nowrap border-2"
                    :class="filter===s ? 'bg-green-700 border-green-700 text-white' : 'bg-white border-slate-200'"
                    x-text="label(s)+' ('+count(s)+')'"></button>
            </template>
        </nav>

        <template x-for="r in filtered()" :key="r.request_id">
            <article class="bg-white rounded-[28px] border border-slate-200 p-6 sm:p-8 lg:p-9 shadow-sm">
                <div class="flex flex-wrap justify-between gap-4">
                    <div>
                        <p class="text-sm text-slate-400 font-black tracking-wide" x-text="r.request_id"></p>
                        <h2 class="font-black text-2xl sm:text-3xl mt-1" x-text="r.user_name||'Không tìm thấy tài khoản'"></h2>
                        <p class="text-base text-slate-500 mt-1" x-text="new Date(r.created_at).toLocaleString('vi-VN')"></p>
                    </div>
                    <span class="h-fit px-4 py-2 rounded-full text-base font-black"
                        :class="r.status==='pending'?'bg-amber-100 text-amber-800':r.status==='approved'?'bg-blue-100 text-blue-800':r.status==='completed'?'bg-green-100 text-green-800':'bg-red-100 text-red-800'"
                        x-text="label(r.status)"></span>
                </div>

                <div class="grid lg:grid-cols-2 gap-5 mt-7">
                    <section class="bg-slate-50 rounded-3xl p-6 space-y-3 text-lg">
                        <h3 class="font-black text-xl mb-4">Thông tin khách cung cấp</h3>
                        <p><b>Số điện thoại:</b> <span x-text="r.lookup_phone"></span></p>
                        <p><b>Gmail cũ:</b> <span x-text="r.old_email||'—'"></span></p>
                        <p><b>Gmail mới:</b> <span x-text="r.new_email"></span></p>
                        <p><b>Mã ao:</b> <span class="font-mono font-bold" x-text="r.pond_code||'—'"></span></p>
                        <p><b>Mã thiết bị:</b> <span class="font-mono font-bold" x-text="r.device_code||'—'"></span></p>
                        <p><b>Ghi chú:</b> <span x-text="r.note||'—'"></span></p>
                    </section>

                    <section class="rounded-3xl p-6 border-2"
                        :class="!r.evidence.account_found ? 'bg-red-50 border-red-200'
                            : hasCodeMatch(r) ? 'bg-green-50 border-green-200' : 'bg-amber-50 border-amber-200'">
                        <h3 class="font-black text-xl">Bước 1 — Hệ thống tự kiểm tra</h3>
                        <div class="flex flex-wrap gap-3 my-4">
                            <span class="px-3 py-2 rounded-xl font-black"
                                :class="r.evidence.account_found?'bg-green-200 text-green-900':'bg-red-200 text-red-900'"
                                x-text="r.evidence.account_found?'✓ Có tài khoản':'✕ Không có tài khoản'"></span>
                            <span class="px-3 py-2 rounded-xl font-black"
                                :class="r.evidence.pond_match?'bg-green-200 text-green-900':'bg-amber-100 text-amber-900'"
                                x-text="r.evidence.pond_match?'✓ Mã ao khớp':'✕ Mã ao chưa khớp'"></span>
                            <span class="px-3 py-2 rounded-xl font-black"
                                :class="r.evidence.device_match?'bg-green-200 text-green-900':'bg-amber-100 text-amber-900'"
                                x-text="r.evidence.device_match?'✓ Thiết bị khớp':'✕ Thiết bị chưa khớp'"></span>
                            <span class="px-3 py-2 rounded-xl font-black"
                                :class="r.evidence.email_available?'bg-green-200 text-green-900':'bg-red-200 text-red-900'"
                                x-text="r.evidence.email_available?'✓ Gmail mới dùng được':'✕ Gmail mới đã có tài khoản'"></span>
                        </div>
                        <div x-show="hasCodeMatch(r)" class="p-4 rounded-2xl bg-white/80 text-green-900 font-bold">
                            Đủ điều kiện kỹ thuật. Admin chỉ cần chọn cách đã liên hệ ở bước 2.
                        </div>
                        <div x-show="r.evidence.account_found && !hasCodeMatch(r)"
                            class="p-4 rounded-2xl bg-white/80 text-amber-900 font-bold">
                            Khách không còn mã cũng có thể khôi phục. Hãy xác minh mạnh bằng gọi video,
                            gặp trực tiếp hoặc giấy tờ mua thiết bị.
                        </div>
                        <div x-show="!r.evidence.account_found" class="p-4 rounded-2xl bg-white/80 text-red-800 font-bold">
                            Không tìm thấy tài khoản theo số điện thoại nên không thể duyệt.
                        </div>
                        <div x-show="!r.evidence.email_available" class="mt-3 p-4 rounded-2xl bg-white/80 text-red-800 font-bold">
                            Gmail mới đang thuộc tài khoản VAST khác. Khách phải gửi yêu cầu mới bằng một Gmail chưa đăng ký.
                        </div>
                        <details class="mt-4 bg-white/70 rounded-2xl p-4">
                            <summary class="font-black cursor-pointer">Xem dữ liệu ao và thiết bị trong hệ thống</summary>
                            <p class="font-bold mt-4">Ao thuộc tài khoản:</p>
                            <p class="text-slate-600 break-words"
                                x-text="r.ponds.length?r.ponds.map(p=>p.pond_id+' — '+p.name).join(', '):'Không có'"></p>
                            <p class="font-bold mt-3">Thiết bị đã gắn:</p>
                            <p class="text-slate-600 break-words"
                                x-text="r.devices.length?r.devices.map(d=>d.device_id+' → '+d.pond_id).join(', '):'Không có'"></p>
                        </details>
                    </section>
                </div>

                <section x-show="r.status==='pending'" class="mt-7 border-t-2 border-slate-100 pt-7">
                    <h3 class="font-black text-xl">Bước 2 — Xác minh nhanh</h3>
                    <p class="text-slate-500 mt-1">Chọn một cách bạn đã dùng để liên hệ đúng chủ tài khoản.</p>
                    <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-3 mt-4">
                        <template x-for="option in verificationOptions" :key="option.value">
                            <button type="button"
                                @click="!(option.value==='phone' && !hasCodeMatch(r)) && (methods[r.request_id]=option.value)"
                                :disabled="option.value==='phone' && !hasCodeMatch(r)"
                                class="p-4 rounded-2xl border-2 text-left font-bold transition"
                                :class="methods[r.request_id]===option.value
                                    ? 'border-green-600 bg-green-50 text-green-900 shadow-sm'
                                    : option.value==='phone' && !hasCodeMatch(r)
                                        ? 'border-slate-200 bg-slate-100 opacity-50 cursor-not-allowed'
                                        : 'border-slate-200 bg-white hover:border-green-300'">
                                <span class="block text-lg" x-text="option.label"></span>
                                <span class="block text-sm font-normal text-slate-500 mt-1" x-text="option.help"></span>
                            </button>
                        </template>
                    </div>

                    <div class="grid lg:grid-cols-2 gap-4 mt-5">
                        <input type="password" x-model="passwords[r.request_id]" autocomplete="current-password"
                            class="w-full p-4 text-lg border-2 border-slate-200 rounded-2xl focus:border-green-600 outline-none"
                            placeholder="Mật khẩu Admin để xác nhận">
                        <input type="text" x-model="notes[r.request_id]"
                            class="w-full p-4 text-lg border-2 border-slate-200 rounded-2xl focus:border-green-600 outline-none"
                            placeholder="Ghi chú thêm (không bắt buộc)">
                    </div>

                    <div class="grid md:grid-cols-2 gap-4 mt-5">
                        <button @click="decide(r,false)" :disabled="busyId===r.request_id"
                            class="min-h-16 p-4 rounded-2xl bg-red-50 border-2 border-red-200 text-red-700 text-lg font-black disabled:opacity-50">
                            Từ chối — yêu cầu nhập lại mã
                        </button>
                        <button @click="decide(r,true)"
                            :disabled="busyId===r.request_id || !canApprove(r) || !methods[r.request_id]"
                            class="min-h-16 p-4 rounded-2xl bg-green-700 text-white text-lg font-black shadow-md disabled:opacity-40 disabled:cursor-not-allowed">
                            Duyệt và gửi mã tới Gmail mới
                        </button>
                    </div>
                    <p x-show="!r.evidence.account_found" class="mt-3 text-red-700 font-bold text-center">
                        Nút duyệt đang khóa vì không tìm thấy tài khoản theo số điện thoại.
                    </p>
                    <p x-show="!r.evidence.email_available" class="mt-3 text-red-700 font-bold text-center">
                        Nút duyệt đang khóa vì Gmail mới đã thuộc một tài khoản khác.
                    </p>
                    <p x-show="r.evidence.account_found && !methods[r.request_id]" class="mt-3 text-amber-700 font-bold text-center">
                        Hãy chọn một phương thức xác minh hợp lệ để mở nút duyệt.
                    </p>
                </section>

                <p x-show="r.review_note" class="mt-5 text-base bg-slate-50 p-4 rounded-2xl">
                    <b>Nhật ký xử lý:</b> <span x-text="r.review_note"></span>
                </p>
            </article>
        </template>

        <p x-show="filtered().length===0"
            class="bg-white rounded-3xl p-12 text-center text-lg text-slate-500 font-black">
            Không có hồ sơ trong nhóm này.
        </p>
    </section>
</main>

<script>
function adminPage() {
    return {
        requests: [],
        audit: [],
        filter: 'pending',
        notes: {},
        passwords: {},
        methods: {},
        authorized: false,
        loading: true,
        busyId: '',
        message: '',
        error: false,
        verificationOptions: [
            { value: 'phone', label: 'Đã gọi đúng số đăng ký', help: 'Chỉ dùng khi mã ao hoặc thiết bị đã khớp.' },
            { value: 'video', label: 'Đã gọi video', help: 'Khách cho xem khu vực ao hoặc hộp VAST.' },
            { value: 'direct', label: 'Đã gặp trực tiếp', help: 'Đối chiếu chủ hộ và thông tin khu nuôi.' },
            { value: 'documents', label: 'Đã kiểm tra giấy tờ', help: 'Hóa đơn, hợp đồng hoặc phiếu mua thiết bị.' }
        ],
        api(path) {
            return (window.VAST_CONFIG?.API_BASE || '').replace(/\/$/, '') + path;
        },
        async call(path, options = {}) {
            const response = await fetch(this.api(path), {
                ...options,
                headers: {
                    ...VAST_DEVICE.authHeaders(!!options.body),
                    ...(options.headers || {})
                }
            });
            const data = await response.json();
            if (!response.ok || !data.ok) {
                const error = new Error(data.error || 'Có lỗi xảy ra');
                error.status = response.status;
                throw error;
            }
            return data;
        },
        async init() {
            try {
                const me = await this.call('/api/auth/me');
                if (!me.user) {
                    location.href = 'login.html';
                    return;
                }
                this.authorized = !!me.user.is_admin;
                if (this.authorized) await this.load();
            } catch (error) {
                this.error = true;
                this.message = error.message;
            } finally {
                this.loading = false;
                setTimeout(() => window.lucide?.createIcons(), 0);
            }
        },
        async load() {
            this.loading = true;
            try {
                const data = await this.call('/api/admin/recovery');
                this.requests = data.requests || [];
                this.audit = data.audit || [];
                this.authorized = true;
                this.error = false;
            } catch (error) {
                this.authorized = error.status !== 403;
                this.error = true;
                this.message = error.message;
            } finally {
                this.loading = false;
            }
        },
        label(status) {
            return ({
                pending: 'Đang chờ',
                approved: 'Đã duyệt',
                completed: 'Hoàn tất',
                rejected: 'Từ chối',
                all: 'Tất cả'
            })[status] || status;
        },
        count(status) {
            return status === 'all'
                ? this.requests.length
                : this.requests.filter(request => request.status === status).length;
        },
        filtered() {
            return this.filter === 'all'
                ? this.requests
                : this.requests.filter(request => request.status === this.filter);
        },
        hasCodeMatch(request) {
            return !!request.evidence?.pond_match || !!request.evidence?.device_match;
        },
        canApprove(request) {
            if (!request.evidence?.account_found) return false;
            if (!request.evidence?.email_available) return false;
            const method = this.methods[request.request_id] || '';
            if (!method) return false;
            if (this.hasCodeMatch(request)) return true;
            return ['video', 'direct', 'documents'].includes(method);
        },
        matchSummary(request) {
            const matched = [];
            if (request.evidence?.pond_match) matched.push('mã ao khớp');
            if (request.evidence?.device_match) matched.push('mã thiết bị khớp');
            return matched.join(', ') || 'mã ao và thiết bị chưa khớp';
        },
        methodLabel(value) {
            return this.verificationOptions.find(option => option.value === value)?.label || '';
        },
        async decide(request, approve) {
            const id = request.request_id;
            const adminPassword = this.passwords[id] || '';
            const extraNote = (this.notes[id] || '').trim();
            const method = this.methods[id] || '';

            if (!adminPassword) {
                this.error = true;
                this.message = 'Vui lòng nhập mật khẩu Admin để xác nhận quyết định.';
                return;
            }
            if (approve && !method) {
                this.error = true;
                this.message = 'Hãy chọn cách bạn đã liên hệ để xác minh chủ tài khoản.';
                return;
            }
            if (approve && !this.canApprove(request)) {
                this.error = true;
                this.message = 'Khi không có mã khớp, hãy xác minh qua video, gặp trực tiếp hoặc giấy tờ.';
                return;
            }

            let reviewNote;
            if (approve) {
                reviewNote = this.methodLabel(method) + '; '
                    + (this.hasCodeMatch(request)
                        ? 'hệ thống xác nhận ' + this.matchSummary(request) + '.'
                        : 'khách không còn mã; Admin đã thực hiện xác minh mạnh.');
                if (extraNote) reviewNote += ' ' + extraNote;
            } else {
                reviewNote = extraNote
                    ? 'Từ chối: ' + extraNote
                    : 'Từ chối: ' + this.matchSummary(request) + '. Yêu cầu khách cung cấp lại mã đúng.';
            }

            this.busyId = id;
            try {
                const data = await this.call('/api/admin/recovery/decision', {
                    method: 'POST',
                    body: JSON.stringify({
                        requestId: id,
                        approve,
                        verified: approve,
                        verificationMethod: method,
                        reviewNote,
                        adminPassword
                    })
                });
                this.passwords[id] = '';
                this.error = false;
                this.message = data.dev_delivery
                    ? 'Đã duyệt. Bản local đang in mã tại cửa sổ server.'
                    : approve
                        ? 'Đã duyệt và gửi mã xác minh tới Gmail mới.'
                        : 'Đã từ chối yêu cầu và ghi nhật ký.';
                await this.load();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                this.passwords[id] = '';
                this.error = true;
                this.message = error.message;
            } finally {
                this.busyId = '';
            }
        }
    };
}
</script>
</body>
</html>
