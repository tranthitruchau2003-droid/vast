<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dùng mã khôi phục - VAST</title><script src="https://cdn.tailwindcss.com"></script><script src="js/vast-config.js?v=5"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><style>[x-cloak]{display:none!important}body{font-family:Inter,Arial,sans-serif}</style></head>
<body class="min-h-screen bg-green-50 flex items-center justify-center p-4" x-data="page()"><main class="w-full max-w-lg"><a href="forgot-password.html" class="font-bold text-green-700">← Quay lại</a><section class="mt-5 bg-white border rounded-3xl shadow-sm p-6 sm:p-9"><img src="assets/logo.png" class="h-14 mx-auto"><h1 class="text-2xl font-black text-center mt-4">Dùng mã khôi phục</h1><p class="text-center text-slate-500 mt-2">Mã dự phòng bạn đã lưu trong phần Bảo mật tài khoản.</p>
<div x-show="msg" x-cloak class="p-4 rounded-xl mt-5 font-semibold" :class="err?'bg-red-50 text-red-700':'bg-green-50 text-green-800'" x-text="msg"></div>
<form x-show="!done" @submit.prevent="submit" class="space-y-4 mt-6"><div><label class="font-bold text-sm">Số điện thoại đăng nhập</label><input x-model.trim="phone" inputmode="tel" class="w-full p-4 border-2 rounded-xl mt-2" placeholder="0901234567"></div><div><label class="font-bold text-sm">Mã khôi phục</label><input x-model.trim="code" class="w-full p-4 border-2 rounded-xl mt-2 uppercase font-bold" placeholder="VAST-XXXX-XXXX-XXXX-XXXX"></div><div><label class="font-bold text-sm">Mật khẩu mới</label><input type="password" x-model="password" class="w-full p-4 border-2 rounded-xl mt-2" autocomplete="new-password"></div><div><label class="font-bold text-sm">Nhập lại mật khẩu</label><input type="password" x-model="confirm" class="w-full p-4 border-2 rounded-xl mt-2" autocomplete="new-password"></div><button :disabled="busy" class="w-full p-4 bg-green-700 text-white rounded-xl font-black disabled:opacity-50" x-text="busy?'Đang xử lý...':'Đặt lại mật khẩu'"></button></form>
<a x-show="done" x-cloak href="login.html" class="block mt-6 p-4 bg-green-700 text-white rounded-xl font-black text-center">Đăng nhập lại</a><div class="mt-6 pt-5 border-t text-center"><a href="account-recovery.html" class="text-green-700 font-bold">Không còn mã? Yêu cầu VAST hỗ trợ</a></div></section></main>
<script>function page(){return{phone:'',code:'',password:'',confirm:'',busy:false,msg:'',err:false,done:false,api(p){return(window.VAST_CONFIG?.API_BASE||'').replace(/\/$/,'')+p},async submit(){this.msg='';if(this.password.length<6){this.err=true;this.msg='Mật khẩu mới phải có ít nhất 6 ký tự.';return}if(this.password!==this.confirm){this.err=true;this.msg='Hai mật khẩu chưa giống nhau.';return}this.busy=true;try{const r=await fetch(this.api('/api/auth/recover/code'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:this.phone,recoveryCode:this.code,newPassword:this.password})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Không thể khôi phục');this.done=true;this.err=false;this.msg='Đã đổi mật khẩu và đăng xuất toàn bộ thiết bị cũ. Mã vừa dùng không còn hiệu lực.'}catch(e){this.err=true;this.msg=e.message}finally{this.busy=false}}}}</script></body></html>
