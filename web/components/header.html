<!-- HEADER -->
<header
    class="bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-slate-200 px-4 md:px-8 py-3 md:py-4 flex justify-between items-center shadow-sm">
    <div class="md:hidden flex items-center">
        <img src="assets/logo.png" alt="VAST Logo" class="w-8 h-8 object-contain mr-1">
        <h1 class="font-bold text-lg text-green-600 uppercase tracking-wider">VAST</h1>
    </div>

    <h2 class="hidden md:block text-2xl font-bold text-slate-800" x-text="getPageTitle()"></h2>

    <div class="flex items-center space-x-3 md:space-x-6">
        <button @click="simulatePhDrop()"
            class="bg-red-50 text-red-600 border border-red-200 px-3 md:px-4 py-2 rounded-full font-bold text-sm flex items-center hover:bg-red-100 transition-colors">
            <i data-lucide="alert-triangle" class="w-4 h-4 mr-1 md:mr-2"></i>
            <span class="hidden md:inline">Demo Tụt pH</span>
            <span class="md:hidden">Demo</span>
        </button>

        <div class="relative" x-data="{ openNotifications: false }">
            <button @click="openNotifications = !openNotifications"
                class="relative p-2 text-slate-600 hover:bg-slate-100 rounded-full transition-all active:scale-95">
                <i data-lucide="bell" class="w-6 h-6"></i>
                <span x-show="alerts.length > 0"
                    class="absolute top-1 right-1 w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
                <span x-show="alerts.length > 0"
                    class="absolute top-1 right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
            </button>
            <!-- Dropdown thông báo -->
            <div x-show="openNotifications" @click.away="openNotifications = false" style="display:none;"
                class="absolute right-0 top-12 mt-2 w-80 bg-white rounded-2xl shadow-xl border border-slate-200 z-[160] overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h4 class="font-bold text-slate-800">Thông báo AI</h4>
                    <span class="text-xs bg-red-100 text-red-600 font-bold px-2 py-1 rounded-full"
                        x-text="alerts.length + ' mới'" x-show="alerts.length > 0"></span>
                </div>
                <div class="max-h-80 overflow-y-auto p-2 space-y-2">
                    <template x-for="alert in alerts" :key="alert.id">
                        <div class="bg-red-50 p-3 rounded-xl border border-red-100 flex gap-3 items-start cursor-pointer hover:bg-red-100 transition-colors"
                            @click="openNotifications=false; currentView='dashboard'; selectedPondId=null;">
                            <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 shrink-0 mt-0.5"></i>
                            <div>
                                <p class="text-sm font-bold text-red-700" x-text="alert.title"></p>
                                <p class="text-xs text-slate-600 mt-1" x-text="alert.message"></p>
                                <p class="text-[10px] text-slate-400 mt-1 font-semibold" x-text="alert.timestamp"></p>
                            </div>
                        </div>
                    </template>
                    <template x-if="alerts.length === 0">
                        <div class="text-center py-6 text-slate-400">
                            <i data-lucide="check-circle" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                            <p class="text-sm font-medium">Hệ thống đang ổn định</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <div
            class="hidden md:flex items-center bg-slate-100 px-4 py-2 rounded-full text-slate-600 font-semibold text-sm">
            <i data-lucide="clock" class="w-4 h-4 mr-2"></i>
            <span x-text="currentTime"></span>
        </div>

        <!-- Click vào đây để mở Modal Hồ sơ -->
        <div class="flex items-center cursor-pointer hover:bg-slate-50 p-2 -mr-2 rounded-xl transition-colors"
            @click="openProfileModal()">
            <!-- Hiển thị ảnh avatar từ bộ nhớ hoặc ảnh mặc định -->
            <img :src="user.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=16a34a&color=fff`"
                alt="Avatar" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover">
            <div class="hidden md:block ml-3">
                <!-- Lấy tên từ dữ liệu đăng ký -->
                <p class="text-sm font-bold text-slate-800" x-text="user.name"></p>
                <!-- <p class="text-xs text-slate-500 font-medium" x-text="user.role"></p> -->
            </div>
        </div>
    </div>
</header>
