<!-- ================= VIEW: DASHBOARD ================= -->
<div x-show="currentView === 'dashboard' && !selectedPondId" x-transition.opacity.duration.300ms>

    <!-- SMART ALERT AREA -->
    <template x-if="alerts.length > 0">
        <div class="mb-6 " style="animation-iteration-count: 3;">
            <div
                class="bg-red-600 text-white p-5 md:p-6 rounded-3xl shadow-lg border-2 border-red-400 relative overflow-hidden flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="absolute inset-0 opacity-10"
                    style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #000 10px, #000 20px);">
                </div>
                <div class="relative z-10 flex items-start md:items-center gap-4">
                    <div class="bg-white/20 p-3 rounded-2xl">
                        <i data-lucide="siren" class="w-8 h-8 text-white"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span
                                class="bg-white text-red-600 text-xs font-black px-2 py-1 rounded-md tracking-wider uppercase"
                                x-text="alerts[0].title"></span>
                            <span class="text-red-100 text-sm font-medium" x-text="alerts[0].timestamp"></span>
                        </div>
                        <h3 class="text-xl md:text-2xl font-bold leading-tight" x-text="alerts[0].message">
                        </h3>
                        <p
                            class="text-red-100 mt-2 font-medium bg-black/20 p-3 rounded-xl border border-red-400/30 flex items-start gap-2">
                            <i data-lucide="bot" class="w-5 h-5 shrink-0 text-yellow-300"></i>
                            <span x-html="'<b>AI Khuyên:</b> ' + alerts[0].recommendation"></span>
                        </p>
                    </div>
                </div>
                <button @click="executeAiAction(alerts[0].id)"
                    class="animate-pulse relative z-10 w-full md:w-auto btn bg-yellow-400 text-yellow-900 hover:bg-yellow-300 py-4 md:py-3 px-6 shadow-xl text-lg md:text-base whitespace-nowrap">
                    <i data-lucide="zap" class="w-5 h-5 mr-2"></i>
                    THỰC THI NGAY
                </button>
            </div>
        </div>
    </template>

    <!-- ===== BANNER: KHONG KET NOI DUOC BACKEND ===== -->
    <template x-if="!iot.serverOk && iot.ready === false">
        <div class="mb-6 bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 flex items-start gap-3 text-amber-800">
            <i data-lucide="server-off" class="w-5 h-5 shrink-0 mt-0.5"></i>
            <div class="text-sm">
                <p class="font-black">CHƯA KẾT NỐI ĐƯỢC MÁY CHỦ IoT</p>
                <p class="text-xs font-medium mt-1">
                    Hãy chạy backend: mở thư mục <b>server</b> rồi gõ <b>node server.js</b>,
                    sau đó mở lại trang bằng <b>http://localhost:3000/dashboard.html</b>.
                    Các ao demo vẫn hoạt động bình thường.
                </p>
            </div>
        </div>
    </template>

    <!-- QUICK ACTIONS -->
    <div class="mb-8">
        <h3 class="text-lg font-bold text-slate-800 mb-4 px-2">THAO TÁC NHANH</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <button @click="startVoiceInput()"
                class="flex flex-col items-center justify-center p-4 bg-green-50 rounded-3xl border-2 border-green-200 shadow-sm hover:shadow-md transition-all active:scale-95 group">
                <!-- Vòng tròn đậm, icon trắng -->
                <div
                    class="w-14 h-14 rounded-full bg-green-600 text-white flex items-center justify-center mb-3 group-hover:scale-110 transition-transform shadow-sm">
                    <i data-lucide="mic" class="w-6 h-6"></i>
                </div>
                <span class="text-sm font-bold text-green-800 text-center leading-snug">Ghi Nhật Ký<br>(Giọng
                    Nói)</span>
            </button>

            <!-- 2. Quạt Nước (BẬT/TẮT HẾT) - Đổi màu động theo trạng thái -->
            <button @click="toggleAll('fan')"
                class="flex flex-col items-center justify-center p-4 rounded-3xl border-2 shadow-sm hover:shadow-md transition-all active:scale-95 group"
                :class="isAllFansOn() ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'">

                <!-- Màu nền tròn cũng tự động đổi (Vàng khi Bật, Xám khi Tắt) -->
                <div class="w-14 h-14 rounded-full text-white flex items-center justify-center mb-3 group-hover:scale-110 transition-all duration-300 shadow-sm"
                    :class="isAllFansOn() ? 'bg-amber-500' : 'bg-slate-400'">

                    <!-- VŨ KHÍ BÍ MẬT: Bọc thẻ span để Alpine.js điều khiển hiệu ứng xoay mượt mà -->
                    <span class="flex items-center justify-center origin-center"
                        :class="isAllFansOn() ? 'animate-spin' : ''">
                        <i data-lucide="fan" class="w-6 h-6"></i>
                    </span>
                </div>

                <span class="text-sm font-bold text-center leading-snug transition-colors"
                    :class="isAllFansOn() ? 'text-amber-800' : 'text-slate-600'">
                    Quạt Nước<br>
                    <!-- Tự động đổi chữ Bật/Tắt theo trạng thái thật -->
                    <span x-text="isAllFansOn() ? '(TẮT HẾT)' : '(BẬT HẾT)'"></span>
                </span>
            </button>

            <button @click="openFeedModal()"
                class="flex flex-col items-center justify-center p-4 bg-blue-50 rounded-3xl border-2 border-blue-200 shadow-sm hover:shadow-md transition-all active:scale-95 group">
                <div
                    class="w-14 h-14 rounded-full bg-blue-600 text-white flex items-center justify-center mb-3 group-hover:scale-110 transition-transform shadow-sm">
                    <i data-lucide="package-plus" class="w-6 h-6"></i>
                </div>
                <span class="text-sm font-bold text-blue-800 text-center leading-snug">Nạp Thức Ăn<br>Cho Từng Ao</span>
            </button>

            <button @click="showAddPondModal = true"
                class="flex flex-col items-center justify-center p-4 bg-red-50 rounded-3xl border-2 border-red-200 shadow-sm hover:shadow-md transition-all active:scale-95 group">
                <div
                    class="w-14 h-14 rounded-full bg-red-500 text-white flex items-center justify-center mb-3 group-hover:scale-110 transition-transform shadow-sm">
                    <i data-lucide="plus" class="w-6 h-6 font-bold"></i>
                </div>
                <span class="text-sm font-bold text-red-800 text-center leading-snug">Thêm Ao<br>Nuôi Tôm</span>
            </button>
        </div>
    </div>

    <!-- POND CARDS GRID -->
    <h3 class="text-lg font-bold text-slate-800 mb-4 px-2">TRẠNG THÁI CÁC AO</h3>

    <!-- ============================================================
         CHUA CO AO NAO
         Truoc day "Ao so 1"/"Ao so 2" la hai dong go cung trong
         dashboard.html nen ai mo cung thay. Gio danh sach doc tu
         database, tai khoan moi se thay trong -> phai giai thich ro
         va cho san loi di, khong de man hinh trang tron.
         ============================================================ -->
    <div x-show="store.ready && ponds.length === 0" x-cloak
        class="card p-8 md:p-10 text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="waves" class="w-8 h-8"></i>
        </div>
        <h4 class="text-lg font-black text-slate-800 mb-2">Chưa có ao nuôi nào</h4>
        <p class="text-sm text-slate-500 font-medium leading-relaxed max-w-md mx-auto">
            Danh sách ao giờ được lưu trong database chứ không còn nằm cứng trong giao diện,
            nên tài khoản mới sẽ bắt đầu từ trống.
        </p>

        <!-- Co ESP32 dang cho -> mot cu bam la xong -->
        <template x-if="storeCoThietBiChoGan()">
            <div class="mt-5">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-green-50 border border-green-200 rounded-xl text-xs font-bold text-green-700 mb-4">
                    <i data-lucide="cpu" class="w-4 h-4"></i>
                    Tìm thấy <span x-text="devices.filter(d => d.gan_duoc && !d.pond_name).length"></span> thiết bị ESP32 chưa gắn ao
                </div>
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <button @click="storeAdoptDevices()" :disabled="store.saving"
                        class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all disabled:opacity-50">
                        <span x-text="store.saving ? 'Đang tạo...' : 'Tạo ao từ thiết bị đang có'"></span>
                    </button>
                    <button @click="showAddPondModal = true; storeLoadDevices()"
                        class="px-6 py-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-2xl active:scale-95 transition-all">
                        Tự nhập thông tin ao
                    </button>
                </div>
            </div>
        </template>

        <!-- Chua co ESP32 nao dang ky -->
        <template x-if="!storeCoThietBiChoGan()">
            <div class="mt-5">
                <button @click="showAddPondModal = true; storeLoadDevices()"
                    class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">
                    Thêm ao nuôi
                </button>
                <p class="text-[11px] text-slate-400 font-medium mt-3">
                    Chưa có thiết bị ESP32 nào đăng ký? Chạy <b>node seed.js</b> trong thư mục server.
                </p>
            </div>
        </template>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 mb-8">
        <template x-for="pond in ponds.slice().reverse()" :key="pond.id">
            <div class="card p-5 md:p-6 flex flex-col relative overflow-hidden transition-all duration-300"
                :class="{ 'border-red-400 shadow-[0_0_15px_rgba(239,68,68,0.3)] bg-red-50/30': pond.status === 'danger' }">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-2xl font-black text-slate-800" x-text="pond.name"></h3>
                        <p class="mt-1 text-xs font-bold text-slate-400">
                            Mã ao: <span class="font-mono text-slate-600" x-text="pond.pond_id"></span>
                        </p>
                        <div class="mt-2 inline-flex items-center px-3 py-1 rounded-full text-xs font-black border"
                            :class="pond.cycle_status === 'empty'
                                ? 'bg-slate-100 text-slate-600 border-slate-200'
                                : 'bg-cyan-50 text-cyan-700 border-cyan-200'">
                            <i :data-lucide="pond.cycle_status === 'empty' ? 'circle-off' : 'waves'"
                                class="w-3.5 h-3.5 mr-1.5"></i>
                            <span x-text="pond.cycle_status === 'empty' ? 'AO TRỐNG' : 'ĐANG NUÔI'"></span>
                        </div>
                        <div class="mt-2 inline-flex items-center px-3 py-1 rounded-full text-sm font-bold shadow-sm"
                            :class="{
                                            'bg-green-100 text-green-700 border border-green-200': pond.status === 'safe',
                                            'bg-yellow-100 text-yellow-700 border border-yellow-200': pond.status === 'warning',
                                            'bg-red-100 text-red-700 border border-red-200 animate-pulse': pond.status === 'danger'
                                         }">
                            <i data-lucide="check-circle-2" class="w-4 h-4 mr-1.5" x-show="pond.status === 'safe'"></i>
                            <i data-lucide="alert-triangle" class="w-4 h-4 mr-1.5" x-show="pond.status !== 'safe'"></i>
                            <span
                                x-text="pond.status === 'safe' ? 'AN TOÀN' : (pond.status === 'warning' ? 'CHÚ Ý' : 'NGUY HIỂM')"></span>
                        </div>
                    </div>
                    <!-- ===== TRANG THAI KET NOI ESP32 (that) ===== -->
                    <template x-if="hasIot(pond)">
                        <div class="flex flex-col items-end gap-1.5">
                            <div class="p-2 rounded-xl border flex items-center gap-1"
                                :class="pond.iot.online ? 'bg-green-50 border-green-100 text-green-600' : 'bg-red-50 border-red-200 text-red-600'">
                                <i :data-lucide="pond.iot.online ? 'wifi' : 'wifi-off'" class="w-4 h-4"></i>
                                <span class="text-xs font-bold" x-text="pond.iot.online ? 'ONLINE' : 'OFFLINE'"></span>
                            </div>

                            <!-- BAO CHE DO CAP NHAT - de biet trinh duyet da nap code moi chua.
                                 REALTIME (xanh)  = server day du lieu xuong tuc thi
                                 Hoi lai (vang)   = dang chay kieu cu, hoi 2 giay/lan -->
                            <span class="text-[10px] font-black px-2 py-1 rounded-full flex items-center gap-1 border"
                                :class="iot.streamOk ? 'bg-green-100 text-green-700 border-green-200' : 'bg-amber-100 text-amber-700 border-amber-200'">
                                <i :data-lucide="iot.streamOk ? 'zap' : 'refresh-cw'" class="w-3 h-3"></i>
                                <span x-text="iot.streamOk ? 'REALTIME' : 'HỎI LẠI 2 GIÂY'"></span>
                            </span>
                        </div>
                    </template>
                    <!-- Ao demo chua gan thiet bi -->
                    <template x-if="!hasIot(pond)">
                        <div
                            class="bg-slate-50 p-2 rounded-xl border border-slate-200 flex items-center gap-1 text-slate-400">
                            <i data-lucide="wifi-off" class="w-4 h-4"></i>
                            <span class="text-xs font-bold">DEMO</span>
                        </div>
                    </template>
                </div>

                <!-- ===== BANG BAO MAT KET NOI ===== -->
                <template x-if="hasIot(pond) && !pond.iot.online">
                    <div
                        class="mb-4 bg-red-50 border-2 border-red-200 rounded-2xl p-3 flex items-start gap-3 text-red-700">
                        <i data-lucide="plug-zap" class="w-5 h-5 shrink-0 mt-0.5"></i>
                        <div class="text-sm">
                            <p class="font-black">ESP32 MẤT KẾT NỐI</p>
                            <p class="text-xs font-medium mt-0.5">
                                Số liệu bên dưới là lần cập nhật cuối lúc
                                <b x-text="iotLastUpdate(pond)"></b>
                                (<span x-text="iotAgoText(pond)"></span>).
                                Chế độ AUTO vẫn đang chạy trực tiếp trên thiết bị.
                            </p>
                        </div>
                    </div>
                </template>

                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="flex items-center text-slate-500 mb-1">
                            <i data-lucide="thermometer" class="w-4 h-4 mr-1"></i>
                            <span class="text-xs font-semibold uppercase">Nhiệt độ</span>
                        </div>
                        <div class="stat-value text-slate-800">
                            <span x-text="pond.temperature"></span><span class="text-lg text-slate-500 ml-1">°C</span>
                        </div>
                    </div>
                    <div class="p-3 rounded-2xl border transition-colors duration-300"
                        :class="pond.status === 'danger' && pond.ph < 7.5 ? 'bg-red-100 border-red-300' : 'bg-slate-50 border-slate-100'">
                        <div class="flex items-center mb-1"
                            :class="pond.status === 'danger' && pond.ph < 7.5 ? 'text-red-600' : 'text-slate-500'">
                            <i data-lucide="droplets" class="w-4 h-4 mr-1"></i>
                            <span class="text-xs font-semibold uppercase">Độ pH</span>
                        </div>
                        <div class="stat-value"
                            :class="pond.status === 'danger' && pond.ph < 7.5 ? 'text-red-700' : 'text-slate-800'">
                            <span x-text="pond.ph"></span>
                        </div>
                        <!-- pH CHUA GAN CAM BIEN THAT (se dung GPIO34 sau nay) -->
                        <template x-if="hasIot(pond) && !pond.iot.ph_connected">
                            <p class="text-[10px] font-bold text-amber-600 mt-1 leading-tight">
                                Chưa kết nối cảm biến<br><span class="text-slate-400 font-medium">(số demo)</span>
                            </p>
                        </template>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="flex items-center text-slate-500 mb-1">
                            <i data-lucide="activity" class="w-4 h-4 mr-1"></i>
                            <span class="text-xs font-semibold uppercase">DO (Oxy)</span>
                        </div>
                        <div class="stat-value text-slate-800">
                            <span x-text="pond.do"></span><span class="text-[1rem] text-slate-500 ml-1">mg/L</span>
                        </div>
                    </div>
                </div>

                <!-- ===== ĐIỆN NĂNG INA219 (dữ liệu thật) ===== -->
                <template x-if="hasIot(pond)">
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 mb-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-slate-500 uppercase flex items-center gap-1">
                                <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> Điện năng (INA219)
                            </span>
                            <span class="text-[10px] font-bold text-slate-400" x-text="iotWifiText(pond)"></span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="bg-white rounded-xl border border-slate-100 py-2">
                                <p class="text-[10px] font-bold text-slate-400 uppercase">Điện áp</p>
                                <p class="text-base font-black text-slate-800"
                                    x-text="iotNum(pond.iot.voltage, 2, 'V')"></p>
                            </div>
                            <div class="bg-white rounded-xl border border-slate-100 py-2">
                                <p class="text-[10px] font-bold text-slate-400 uppercase">Dòng</p>
                                <p class="text-base font-black text-slate-800"
                                    x-text="iotNum(pond.iot.current_ma, 0, 'mA')"></p>
                            </div>
                            <div class="bg-white rounded-xl border border-slate-100 py-2">
                                <p class="text-[10px] font-bold text-slate-400 uppercase">Công suất</p>
                                <p class="text-base font-black text-slate-800"
                                    x-text="iotNum(pond.iot.power_w, 2, 'W')"></p>
                            </div>
                        </div>
                        <p class="text-[11px] text-slate-400 font-semibold mt-2 text-center">
                            Cập nhật lúc <b class="text-slate-600" x-text="iotLastUpdate(pond)"></b>
                            (<span x-text="iotAgoText(pond)"></span>)
                        </p>
                    </div>
                </template>

                <!-- ===== CHỌN CHẾ ĐỘ AUTO / MANUAL (dữ liệu thật) ===== -->
                <template x-if="hasIot(pond)">
                    <div class="mb-4">
                        <span class="text-xs font-bold text-slate-500 uppercase mb-2 block">Chế độ điều khiển</span>
                        <div class="bg-slate-100 p-1 rounded-xl flex gap-1">
                            <button @click="iotSetMode(pond.id, 'AUTO')" :disabled="!pond.iot.online"
                                class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all active:scale-95 disabled:opacity-40 flex items-center justify-center gap-1.5"
                                :class="pond.iot.mode === 'AUTO' ? 'bg-green-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                                <i data-lucide="cpu" class="w-4 h-4"></i> AUTO
                            </button>
                            <button @click="iotSetMode(pond.id, 'MANUAL')" :disabled="!pond.iot.online"
                                class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all active:scale-95 disabled:opacity-40 flex items-center justify-center gap-1.5"
                                :class="pond.iot.mode === 'MANUAL' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                                <i data-lucide="hand" class="w-4 h-4"></i> MANUAL
                            </button>
                        </div>

                        <!-- Đang chờ ESP32 xác nhận đổi chế độ -->
                        <template x-if="iotPending(pond.id, 'mode')">
                            <p class="text-[11px] font-bold text-blue-600 mt-2 flex items-center gap-1 animate-pulse">
                                <i data-lucide="loader" class="w-3.5 h-3.5"></i> Đang chờ ESP32 xác nhận đổi chế độ...
                            </p>
                        </template>

                        <!-- Giải thích khi đang AUTO -->
                        <template x-if="pond.iot.mode === 'AUTO' && !iotPending(pond.id, 'mode')">
                            <p
                                class="text-[11px] font-semibold text-green-700 bg-green-50 border border-green-100 rounded-xl px-3 py-2 mt-2 flex items-start gap-1.5">
                                <i data-lucide="shield-check" class="w-4 h-4 shrink-0 mt-px"></i>
                                <span>ESP32 đang <b>tự điều khiển</b>: DO &lt; 5.0 bật guồng oxy, nhiệt độ &gt; 32°C bật
                                    máy bơm. Nút bật/tắt tay bị khoá.</span>
                            </p>
                        </template>
                    </div>
                </template>

                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 mb-6 grid grid-cols-2 gap-3">
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-slate-500 uppercase mb-2">
                            <span x-text="hasIot(pond) ? 'Guồng Oxy (GPIO26)' : 'Quạt Nước'"></span>
                        </span>
                        <button @click="toggleDevice(pond.id, 'fan')"
                            :disabled="hasIot(pond) && (pond.iot.mode === 'AUTO' || !pond.iot.online || iotPending(pond.id,'aerator'))"
                            class="flex items-center justify-between p-3 rounded-xl transition-all border-2 active:scale-95 disabled:cursor-not-allowed disabled:opacity-60"
                            :class="pond.fan ? 'bg-green-100 border-green-500 text-green-700' : 'bg-white border-slate-200 text-slate-400'">
                            <i data-lucide="fan" class="w-6 h-6" :class="{'animate-spin text-green-600': pond.fan}"></i>
                            <span class="font-bold text-lg"
                                x-text="iotPending(pond.id,'aerator') ? '...' : (pond.fan ? 'BẬT' : 'TẮT')"></span>
                        </button>
                        <template x-if="iotPending(pond.id, 'aerator')">
                            <p class="text-[10px] font-bold text-blue-600 mt-1 animate-pulse">Đang chờ thiết bị...</p>
                        </template>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-slate-500 uppercase mb-2">
                            <span x-text="hasIot(pond) ? 'Máy Bơm (GPIO27)' : 'Máy Bơm'"></span>
                        </span>
                        <button @click="toggleDevice(pond.id, 'pump')"
                            :disabled="hasIot(pond) && (pond.iot.mode === 'AUTO' || !pond.iot.online || iotPending(pond.id,'pump'))"
                            class="flex items-center justify-between p-3 rounded-xl transition-all border-2 active:scale-95 disabled:cursor-not-allowed disabled:opacity-60"
                            :class="pond.pump ? 'bg-blue-100 border-blue-500 text-blue-700' : 'bg-white border-slate-200 text-slate-400'">
                            <i data-lucide="waves" class="w-6 h-6" :class="{'text-blue-600': pond.pump}"></i>
                            <span class="font-bold text-lg"
                                x-text="iotPending(pond.id,'pump') ? '...' : (pond.pump ? 'BẬT' : 'TẮT')"></span>
                        </button>
                        <template x-if="iotPending(pond.id, 'pump')">
                            <p class="text-[10px] font-bold text-blue-600 mt-1 animate-pulse">Đang chờ thiết bị...</p>
                        </template>
                    </div>
                </div>

                <!-- Nút mở mục Chi Tiết Ao -->
                <button @click="openPondDetail(pond.id)"
                    class="mt-auto w-full btn btn-primary py-3.5 text-lg shadow-sm border border-green-700/20">
                    CHI TIẾT AO
                </button>
            </div>
        </template>
    </div>

    <!-- Da bo "BIEU DO MOI TRUONG CHUNG" theo yeu cau.
         Bieu do chi tiet cua tung ao van con trong man hinh chi tiet ao. -->
</div>
