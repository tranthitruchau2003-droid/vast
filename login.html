<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - VAST</title>

    <!-- Google Fonts: Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#D8EADF',
                            surface: '#FFFFFF',
                            primary: '#2A8B47',
                            primaryHover: '#227339',
                            textPrimary: '#2D3748',
                            textSecondary: '#4A5568',
                            textMuted: '#718096',
                            borderColor: '#E2E8F0',
                        }
                    },
                    boxShadow: {
                        card: '0 10px 40px rgba(0, 0, 0, 0.05)',
                        btn: '0 8px 20px rgba(42, 139, 71, 0.3)',
                    },
                    borderRadius: {
                        'md': '16px',
                        'lg': '24px',
                    }
                }
            }
        }
    </script>
</head>

<!-- Đảm bảo body luôn chiếm full màn hình và căn giữa tuyệt đối cả chiều dọc lẫn ngang -->

<body
    class="font-sans bg-brand-bg text-brand-textPrimary w-full min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 my-auto"
    hx-boost="true">

    <div class="bg-brand-surface p-6 sm:p-10 rounded-lg shadow-card w-full max-w-[480px] mx-auto my-auto">

        <!-- Header -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="flex items-center justify-center mb-3 sm:mb-4">
                <img src="logo.png" alt="VAST" class="h-12 sm:h-[60px] w-auto object-contain">
            </div>
            <h1 class="text-xl sm:text-2xl font-bold mb-1 sm:mb-2">Đăng Nhập Hệ Thống</h1>
            <p class="text-brand-textSecondary text-sm sm:text-base">Nhập số điện thoại của bạn để tiếp tục</p>
        </div>

        <!-- Form xử lý lưu thông tin vào localStorage rồi chuyển sang dashboard.html -->
        <form x-data="{ 
                phone: '', 
                password: '', 
                showPassword: false,
                handleLogin() {
                    if (this.phone) {
                        localStorage.setItem('currentUser', JSON.stringify({
                            name: 'Nông dân ' + this.phone.slice(-4),
                            role: 'Trại trưởng',
                            phone: this.phone
                        }));
                        window.location.href = 'dashboard.html';
                    }
                }
            }" @submit.prevent="handleLogin()">

            <!-- Input Số điện thoại -->
            <div class="mb-4 sm:mb-6">
                <label class="block font-semibold text-sm sm:text-base mb-2">Số điện thoại</label>
                <div class="relative flex items-center">
                    <i data-lucide="phone" class="absolute left-4 text-brand-textMuted w-5 h-5"></i>
                    <input type="tel" x-model="phone"
                        class="w-full py-3 sm:py-4 pr-4 pl-12 border-2 border-brand-borderColor rounded-md text-sm sm:text-base transition-colors focus:border-brand-primary focus:outline-none bg-slate-50"
                        placeholder="Ví dụ: 0912345678" required>
                </div>
            </div>

            <!-- Input Mật khẩu -->
            <div class="mb-4 sm:mb-6">
                <label class="block font-semibold text-sm sm:text-base mb-2">Mật khẩu</label>
                <div class="relative flex items-center">
                    <i data-lucide="lock" class="absolute left-4 text-brand-textMuted w-5 h-5"></i>
                    <input :type="showPassword ? 'text' : 'password'" id="password" x-model="password"
                        class="w-full py-3 sm:py-4 pr-12 pl-12 border-2 border-brand-borderColor rounded-md text-sm sm:text-base transition-colors focus:border-brand-primary focus:outline-none bg-slate-50"
                        placeholder="Nhập mật khẩu" required>

                    <!-- Nút Toggle Password sử dụng Alpine.js -->
                    <button type="button"
                        class="absolute right-4 text-brand-textMuted p-1 cursor-pointer hover:text-brand-textPrimary transition-colors"
                        @click="showPassword = !showPassword; $nextTick(() => lucide.createIcons())">
                        <template x-if="!showPassword">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </template>
                        <template x-if="showPassword">
                            <i data-lucide="eye-off" class="w-5 h-5"></i>
                        </template>
                    </button>
                </div>
            </div>

            <!-- Quên mật khẩu -->
            <a href="#"
                class="block text-right text-brand-primary font-semibold text-sm sm:text-[15px] -mt-2 sm:-mt-3 mb-4 sm:mb-6 hover:underline">Quên
                mật khẩu?</a>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full py-3 sm:p-4 bg-brand-primary hover:bg-brand-primaryHover text-white rounded-full text-base sm:text-[18px] font-bold flex justify-center items-center gap-2 shadow-btn transition-transform duration-300 active:scale-95 cursor-pointer">
                Đăng Nhập
            </button>
        </form>

        <!-- Đăng ký -->
        <div class="text-center text-brand-textSecondary text-sm sm:text-base font-medium mt-4 sm:mt-6">
            Chưa có tài khoản? <a href="register.html" class="text-brand-primary font-bold hover:underline">Đăng ký
                ngay</a>
        </div>
    </div>

    <!-- Khởi tạo Icon Lucide -->
    <script>
        document.addEventListener('alpine:init', () => {
            lucide.createIcons();
        });

        document.body.addEventListener('htmx:afterSwap', function () {
            lucide.createIcons();
        });

        lucide.createIcons();
    </script>
</body>

</html>
