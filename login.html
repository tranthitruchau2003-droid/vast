<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - VAST</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2A8B47">

    <!-- Google Fonts: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#D8EADF',
                            surface: '#FFFFFF',
                            primary: '#2A8B47',
                            primaryHover: '#227339',
                            textPrimary: '#2D3748',
                            textSecondary: '#4A5568',
                            textMuted: '#718096',
                            borderColor: '#E2E8F0',
                        }
                    },
                    boxShadow: {
                        card: '0 20px 40px -15px rgba(0, 0, 0, 0.05)',
                        btn: '0 8px 20px rgba(42, 139, 71, 0.25)',
                    }
                }
            }
        }
    </script>
</head>

<!-- Sửa min-h-screen thành h-screen để ngăn cuộn nếu không cần thiết, và đảm bảo căn giữa tuyệt đối -->

<body
    class="font-sans bg-brand-bg text-brand-textPrimary w-full h-screen flex flex-col justify-center items-center p-4 sm:p-6"
    hx-boost="true">

    <!-- Wrapper tổng chứa toàn bộ nội dung, giới hạn chiều cao max-h-full để tránh tràn -->
    <div
        class="w-full max-w-[460px] mx-auto flex flex-col justify-center items-center h-full max-h-full overflow-y-auto no-scrollbar py-4">

        <div class="w-full">
            <!-- HEADER (Nằm ngoài thẻ trắng) -->
            <div class="text-center mb-6 sm:mb-8">
                <!-- Logo bấm để về trang chủ -->
                <a href="index.html"
                    class="inline-block transition-transform hover:scale-105 mb-4 sm:mb-5 focus:outline-none">
                    <img src="logo.png" alt="VAST Logo"
                        class="h-12 sm:h-16 w-auto mx-auto object-contain drop-shadow-sm">
                </a>
                <h1 class="text-2xl sm:text-3xl font-extrabold mb-2 text-slate-800 tracking-tight">Chào mừng trở lại
                </h1>
                <p class="text-slate-600 text-sm sm:text-base font-medium">Đăng nhập để quản lý ao tôm thông minh</p>
            </div>

            <!-- FORM CARD (Khung trắng) -->
            <div class="bg-brand-surface p-6 sm:p-10 rounded-[24px] shadow-card w-full border border-white/50">
                <form x-data="{ 
                        phone: '', 
                        password: '', 
                        showPassword: false,
                        handleLogin() {
                            if (this.phone) {
                                localStorage.setItem('currentUser', JSON.stringify({
                                    name: 'Nông dân ' + this.phone.slice(-4),
                                    role: 'Trại trưởng',
                                    phone: this.phone
                                }));
                                window.location.href = 'dashboard.html';
                            }
                        }
                    }" @submit.prevent="handleLogin()">

                    <!-- Input Số điện thoại -->
                    <div class="mb-5">
                        <label class="block font-bold text-slate-700 text-sm sm:text-[15px] mb-2">Số điện thoại</label>
                        <div class="relative flex items-center">
                            <i data-lucide="phone" class="absolute left-4 text-slate-400 w-5 h-5"></i>
                            <input type="tel" x-model="phone"
                                class="w-full py-3.5 sm:py-4 pr-4 pl-12 border-2 border-slate-200 rounded-xl text-sm sm:text-base transition-all focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/10 focus:outline-none bg-slate-50 font-medium text-slate-800"
                                placeholder="Ví dụ: 0912345678" required>
                        </div>
                    </div>

                    <!-- Input Mật khẩu -->
                    <div class="mb-5">
                        <label class="block font-bold text-slate-700 text-sm sm:text-[15px] mb-2">Mật khẩu</label>
                        <div class="relative flex items-center">
                            <i data-lucide="lock" class="absolute left-4 text-slate-400 w-5 h-5"></i>
                            <input :type="showPassword ? 'text' : 'password'" id="password" x-model="password"
                                class="w-full py-3.5 sm:py-4 pr-12 pl-12 border-2 border-slate-200 rounded-xl text-sm sm:text-base transition-all focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/10 focus:outline-none bg-slate-50 font-medium text-slate-800"
                                placeholder="Nhập mật khẩu" required>

                            <!-- Nút ẩn/hiện mật khẩu -->
                            <button type="button"
                                class="absolute right-4 text-slate-400 p-1 cursor-pointer hover:text-brand-primary transition-colors focus:outline-none"
                                @click="showPassword = !showPassword; $nextTick(() => lucide.createIcons())">
                                <template x-if="!showPassword"><i data-lucide="eye" class="w-5 h-5"></i></template>
                                <template x-if="showPassword"><i data-lucide="eye-off" class="w-5 h-5"></i></template>
                            </button>
                        </div>
                    </div>

                    <!-- Cụm Đăng nhập Vân tay & Quên mật khẩu -->
                    <div class="flex justify-between items-center mb-6">

                        <!-- Nút Đăng nhập Vân tay -->
                        <button type="button"
                            class="flex items-center gap-2 text-slate-600 hover:text-brand-primary transition-colors focus:outline-none p-1.5 -ml-1.5 rounded-lg active:scale-95 hover:bg-brand-primary/10 cursor-pointer"
                            @click="alert('Hệ thống đang mở cảm biến vân tay/FaceID...')">
                            <!-- Icon vân tay của Lucide -->
                            <i data-lucide="fingerprint" class="w-7 h-7 text-brand-primary"></i>
                            <span class="text-sm font-bold"></span>
                        </button>

                        <!-- Quên mật khẩu -->
                        <a href="#" class="text-brand-primary font-bold text-sm hover:underline transition-all">
                            Quên mật khẩu?
                        </a>
                    </div>

                    <!-- Nút Đăng Nhập -->
                    <button type="submit"
                        class="w-full py-3.5 sm:py-4 bg-brand-primary hover:bg-brand-primaryHover text-white rounded-xl text-base sm:text-lg font-bold flex justify-center items-center shadow-btn transition-transform duration-300 active:scale-95 cursor-pointer">
                        Đăng nhập
                    </button>

                    <!-- Đường kẻ ngăn cách (Divider) -->
                    <div class="flex items-center my-6 sm:my-8">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="px-4 text-xs sm:text-sm text-slate-400 font-semibold uppercase tracking-wider">Hoặc
                            đăng nhập với</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>

                    <!-- Nút Đăng nhập Google -->
                    <button type="button"
                        class="w-full py-3.5 sm:py-4 bg-white border-2 border-slate-200 hover:bg-slate-50 hover:border-slate-300 text-slate-700 rounded-xl text-sm sm:text-base font-bold flex justify-center items-center gap-3 transition-all active:scale-95 cursor-pointer">
                        <!-- Icon Google SVG (Tích hợp trực tiếp để không cần file ảnh ngoài) -->
                        <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                            <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
                                <path fill="#4285F4"
                                    d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z" />
                                <path fill="#34A853"
                                    d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z" />
                                <path fill="#FBBC05"
                                    d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z" />
                                <path fill="#EA4335"
                                    d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 41.939 C -8.804 39.869 -11.514 38.649 -14.754 38.649 C -19.444 38.649 -23.494 41.349 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z" />
                            </g>
                        </svg>
                        Đăng nhập với Google
                    </button>

                    <!-- Liên kết Đăng ký -->
                    <div class="text-center text-slate-500 text-sm sm:text-base font-medium mt-6 sm:mt-8">
                        Chưa có tài khoản? <a href="register.html"
                            class="text-brand-primary font-bold hover:underline transition-all">Đăng ký ngay</a>
                    </div>
                </form>
            </div>

            <!-- FOOTER (Điều khoản bên dưới form) -->
            <p class="mt-6 sm:mt-8 text-xs sm:text-sm text-slate-500 font-medium text-center">
                Bằng việc đăng nhập, bạn đồng ý với <a href="#"
                    class="text-brand-primary hover:underline transition-all font-bold">Điều khoản sử dụng</a>
            </p>
        </div>

    </div>

    <!-- Khởi tạo Icon Lucide -->
    <script>
        document.addEventListener('alpine:init', () => {
            lucide.createIcons();
        });

        document.body.addEventListener('htmx:afterSwap', function () {
            lucide.createIcons();
        });

        lucide.createIcons();
    </script>
    <style>
        /* Ẩn scrollbar cho đẹp */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }
    </style>
</body>

</html>
